name: sar_track
description: "Sistem Koordinasi Lapangan Terintegrasi untuk Tim SAR."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_database: ^12.4.1

  # State Management — GetX
  get: ^4.7.2

  # Auth — pin ke versi stabil dengan API yang dikenal
  google_sign_in: 6.1.0

  # Maps & Lokasi
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true